<svg width="720" height="170" viewBox="0 0 720 170" xmlns="http://www.w3.org/2000/svg">

  <!-- Shield -->
  <path d="M40 10 L100 30 L100 80 C100 120 70 150 40 160 C10 150 -20 120 -20 80 L-20 30 Z"
        fill="#1e40af"/>

  <!-- QR squares -->
  <rect x="10" y="40" width="12" height="12" fill="#ffffff"/>
  <rect x="28" y="40" width="12" height="12" fill="#ffffff"/>
  <rect x="10" y="58" width="12" height="12" fill="#ffffff"/>
  <rect x="28" y="58" width="12" height="12" fill="#ffffff"/>

  <rect x="60" y="45" width="10" height="10" fill="#ffffff"/>
  <rect x="75" y="60" width="8" height="8" fill="#ffffff"/>

  <!-- Checkmark -->
  <path d="M20 95 L38 112 L75 75"
        stroke="#22c55e"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- TEXT -->
  <text x="140" y="75" font-family="Arial, sans-serif" font-size="42" font-weight="800">
    <tspan fill="#0f172a">Site</tspan>
    <tspan fill="#2563eb">Passport</tspan>
  </text>

  <!-- TAGLINE -->
  <text x="140" y="115" font-family="Arial, sans-serif" font-size="18" letter-spacing="3" fill="#64748b">
    VERIFY. CONFIRM. TRUST.
  </text>

</svg>